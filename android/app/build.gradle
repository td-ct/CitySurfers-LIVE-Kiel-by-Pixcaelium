plugins { id 'com.android.application' }

android {
    namespace 'de.timodamm.kvglive'
    compileSdk 34

    defaultConfig {
        applicationId 'de.timodamm.kvglive'
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName '1.0.5'
        manifestPlaceholders = [appLabel: "@string/app_name"]
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            manifestPlaceholders = [appLabel: "@string/app_name_debug"]
        }
        release {
            minifyEnabled false
            // Release-APK mit Debug-Key signieren: direkt installierbar.
            // (Ohne feste Signierung erzeugt jeder CI-Lauf einen neuen Key,
            // App-Updates also per Deinstallieren+Neuinstallieren.)
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
