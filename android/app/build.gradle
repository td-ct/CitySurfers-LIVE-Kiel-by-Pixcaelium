plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'de.timodamm.kvglive'
    compileSdk 34

    defaultConfig {
        applicationId 'de.timodamm.kvglive'
        minSdk 24
        targetSdk 34
        versionCode 27
        versionName '1.1.3'
        manifestPlaceholders = [appLabel: "@string/app_name"]
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            manifestPlaceholders = [appLabel: "@string/app_name_debug"]
        }
        release {
            minifyEnabled false
            // Release-APK mit Debug-Key signieren: direkt installierbar.
            // (Ohne feste Signierung erzeugt jeder CI-Lauf einen neuen Key,
            // App-Updates also per Deinstallieren+Neuinstallieren.)
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-location:21.3.0'
}
