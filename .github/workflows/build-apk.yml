name: Android-APK bauen

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: SDK-Lizenzen akzeptieren
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: index.html als Asset einbetten
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html

      - name: APK bauen
        run: gradle -p android assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: CitySurfers-LIVE-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Als Release bereitstellen (stabil android-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          TAG=android-latest
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --title "CitySurfers LIVE Kiel – Android APK" \
            --notes "Mini-App: WebView (gebündelte index.html) + native Wecker (AlarmManager) und Vibration. Debug-Build." \
            || gh release upload "$TAG" "$APK" --clobber --repo "$GITHUB_REPOSITORY"
