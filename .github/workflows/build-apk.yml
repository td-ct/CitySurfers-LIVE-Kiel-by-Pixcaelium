name: Android-APK bauen

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # ubuntu-latest bringt das Android SDK vorinstalliert mit;
      # nur Lizenzen akzeptieren, fehlende Plattforms/Build-Tools zieht AGP selbst.
      - name: SDK-Lizenzen akzeptieren
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: index.html als Asset einbetten
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html

      - name: APKs bauen (Release + Debug)
        run: gradle -p android assembleRelease assembleDebug --no-daemon

      - name: APKs umbenennen
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk cslk.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk cslkd.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CitySurfers-LIVE-Android
          path: |
            cslk.apk
            cslkd.apk

      - name: Als Release bereitstellen (stabil android-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=android-latest
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create "$TAG" cslk.apk cslkd.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "CitySurfers LIVE Kiel – Android App" \
            --notes "Mini-App: WebView + native Wecker (AlarmManager) und Vibration.
          cslk.apk = Release-Build, cslkd.apk = Debug-Build (parallele Installation möglich).
          Beide mit CI-Debug-Key signiert: Updates durch Deinstallieren + Neuinstallieren." \
            || gh release upload "$TAG" cslk.apk cslkd.apk --clobber --repo "$GITHUB_REPOSITORY"
