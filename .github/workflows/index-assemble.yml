name: index-assemble
on:
  push:
    branches: [main]
    paths: [".build/**"]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: index.html aus Teilen zusammensetzen
        run: |
          echo "::error::DEBUG build-dir: $(find .build -maxdepth 1 -type f -printf '%s %p\n' 2>&1 | tr '\n' '|')" || true
          cat $(find .build -maxdepth 1 -name 'p[0-9][0-9]' | sort) > index.html
          SZ=$(wc -c < index.html)
          if [ "$SZ" != "1144861" ]; then echo "::error::Falsche Groesse: $SZ (erwartet 1144861), parts: $(find .build -maxdepth 1 -name 'p[0-9][0-9]' -printf '%s ' 2>&1)"; exit 1; fi
          grep -q "Version 1.6.53" index.html || { echo "::error::Version 1.6.53 nicht gefunden"; exit 1; }
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -rq .build
          git add index.html
          git commit -m "index.html v1.6.53 aus .build-Teilen zusammengesetzt [skip ci]" || exit 0
          git push
