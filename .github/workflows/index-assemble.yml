name: index-assemble
on:
  push:
    paths:
      - '.build/**'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Teile zusammenfuegen
        run: |
          set -e
          cat $(find .build -maxdepth 1 -name 'p[0-9][0-9]' | sort) > index.html
          SZ=$(stat -c%s index.html)
          if [ "$SZ" -ne 1068237 ]; then echo "Unerwartete Groesse: $SZ (erwartet 1068237)"; exit 1; fi
          grep -q "Version 1.6.39" index.html || { echo "Verline 1.6.39 fehlt"; exit 1; }
      - name: Einchecken
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -rq .build
          git add index.html
          git commit -m "index.html v1.6.39 (aus .build-Teilen zusammengesetzt) [skip ci]"
          git push
