name: index-assemble
on:
  push:
    branches: [main]
    paths: [".build/**"]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: index.html aus Teilen zusammensetzen
        run: |
          cat $(find .build -maxdepth 1 -name 'p[0-9][0-9]' | sort) > index.html
          SZ=$(wc -c < index.html)
          if [ "$SZ" != "1205477" ]; then
            echo "::error::Falsche Groesse: $SZ (erwartet 1205477)"
            find .build -maxdepth 1 -name 'p[0-9][0-9]' -printf "%f %s bytes\n" | sort
            exit 1
          fi
          if ! grep -q "Version 1.6.68" index.html; then
            echo "::error::Versionszeichenkette 'Version 1.6.68' fehlt in index.html"
            exit 1
          fi
      - name: Commit und Push
        run: |
          git config user.name "CSLK-Bot"
          git config user.email "noreply@timo-damm.de"
          git rm -rq .build
          git add index.html
          git commit -m "index.html v1.6.68 aus .build-Teilen zusammengesetzt [skip ci]"
          git push
