name: "index-assemble"

on:
  push:
    branches: [ main ]
    paths: [ ".build/RUN" ]

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Teile zusammenfuegen und md5 pruefen
        run: |
          set -e
          md5_expect=$(head -n1 .build/RUN | tr -d '\r' | tr -d '[:space:]')
          cat .build/part-* > index.html
          md5_got=$(md5sum index.html | cut -d' ' -f1)
          echo "erwartet: $md5_expect"
          echo "gebaut:   $md5_got"
          if [ "$md5_expect" != "$md5_got" ]; then
            echo "MD5-MISMATCH: Abbruch"; exit 1
          fi

      - name: index.html committen, .build aufraeumen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r -q .build || true
          git add index.html
          git commit -m "v1.6.37: index.html aus .build-Teilen assembliert [skip ci]"
          git push origin HEAD:main
