name: index-assemble

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ ".build/**" ]

jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: index.html aus Teilen zusammensetzen
        run: |
          set -e
          test -d .build
          cat $(find .build -maxdepth 1 -name 'p*' | sort) > index.html
          test "$(wc -c < index.html)" = "1133067"
          grep -q "Version 1.6.38" index.html
          wc -c index.html

      - name: Teile entfernen, index.html committen
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -rq .build
          git add index.html
          git commit -m "v1.6.38 index.html: aus Teilen zusammengesetzt (Fahrplan-Kataloge Eichhoernchen-Alarm) [skip ci]"
          git push
